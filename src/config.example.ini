# Vorlage: nach config.ini kopieren und ausfuellen. Im Container wird sie nach
# /solarflow/config.ini eingehaengt; sie muss fuer UID 568 lesbar sein.

[solarflow]
# Solarflow Hub 2000 (nur dieses Modell wird unterstuetzt)
product_id = A8yh63
# Geraete-ID des Hubs (8 Zeichen, z. B. aus dem solarflow-bt-manager)
device_id = XXXXXXXX

[ace]
# Ace 1500
product_id = 8bM93H
device_id = XXXXXXXX

[mqtt]
# Lokaler Broker, an den Hub und Ace berichten
mqtt_host = mosquitto
# optional, Vorgabe 1883
mqtt_port = 1883
# optional, nur wenn der Broker Anmeldung verlangt
mqtt_user = user
mqtt_pwd = secret
